radar_scan_slam_node:
  ros__parameters:
    # Frames
    map_frame: "map"
    odom_frame: "odom"

    # Scan accumulation
    accumulation_scans: 20
    keyframe_min_distance: 0.5
    voxel_leaf_size: 0.20
    min_submap_points: 50

    # GICP — corridor: larger correspondence distance to handle longer dead-reckoning drift
    max_correspondence_distance: 1.5
    max_iterations: 50
    transformation_epsilon: 1e-4
    euclidean_fitness_epsilon: 1e-5
    max_fitness_score: 15.0
    gicp_correspondence_randomness: 5

    # Correction limits — corridor: generous to cover drift over long stretches
    max_correction_m: 4.0
    max_correction_rad: 0.6

    # TF broadcast rate
    tf_publish_hz: 10.0

    # Debug
    publish_submap: true

    # Scan-to-map
    enable_scan_to_map: true
    global_map_max_submaps: 20
    min_map_points: 100

    # Loop closure detection
    enable_loop_closure: true
    loop_closure_min_distance: 5.0
    loop_closure_max_submaps: 100
    loop_closure_fitness_threshold: 0.3     # corridor: permissive — long straight sections are hard to match
    loop_closure_max_correction_m: 0.5
