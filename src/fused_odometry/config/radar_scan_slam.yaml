radar_scan_slam_node:
  ros__parameters:
    # Frames
    map_frame: "map"
    odom_frame: "odom"

    # Scan accumulation — keyframe triggers when BOTH conditions are met
    accumulation_scans: 20
    keyframe_min_distance: 0.5
    voxel_leaf_size: 0.20
    min_submap_points: 50

    # GICP
    max_correspondence_distance: 1.5   # was 0.5 — key fix: with 0.2–0.6m drift per keyframe,
                                       # 0.5m left GICP right at the correspondence edge → mass divergence
    max_iterations: 50
    transformation_epsilon: 1e-4
    euclidean_fitness_epsilon: 1e-5
    max_fitness_score: 15.0     # GICP mean-sq-dist threshold: lower = better match
    gicp_correspondence_randomness: 5

    # Correction limits — set to cover realistic dead-reckoning drift per keyframe.
    # At 20 scans × ~0.5s = 10s of dead-reckoning at 0.3m/s → ~3m possible drift.
    # Fitness threshold is the primary quality gate; these reject only gross outliers.
    max_correction_m: 4.0
    max_correction_rad: 0.6

    # TF broadcast rate
    tf_publish_hz: 10.0

    # Debug
    publish_submap: true

    # Scan-to-map
    enable_scan_to_map: true
    global_map_max_submaps: 20
    min_map_points: 100

    # Loop closure detection
    enable_loop_closure: true
    loop_closure_min_distance: 5.0          # Only match submaps >5m apart in odometry
    loop_closure_max_submaps: 100           # Keep history of 100 submaps
    loop_closure_fitness_threshold: 0.3     # Accept loop only if GICP fitness < this (lower = better match)
    loop_closure_max_correction_m: 0.5      # Reject correction if >0.5m translation
